name: Build signed Android release

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type BUILD_RELEASE to build a signed release APK and AAB."
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    if: ${{ github.ref == 'refs/heads/main' && github.event.inputs.confirm == 'BUILD_RELEASE' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Validate Firebase config and decode release keystore
        env:
          FIREBASE_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
          FIREBASE_PROJECT_ID: gen-lang-client-0963224775
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$FIREBASE_GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Add FIREBASE_GOOGLE_SERVICES_JSON for the owner-confirmed Firebase project."
            exit 1
          fi
          if [ -z "$ANDROID_UPLOAD_KEYSTORE_BASE64" ] || [ -z "$ANDROID_UPLOAD_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_UPLOAD_KEY_PASSWORD" ]; then
            echo "::error::Add the three Android upload-keystore repository secrets."
            exit 1
          fi
          printf '%s' "$FIREBASE_GOOGLE_SERVICES_JSON" > app/google-services.json
          node -e 'const p=JSON.parse(process.env.FIREBASE_GOOGLE_SERVICES_JSON); const expected="com.anchor.parent"; const project=p.project_info?.project_id; const clients=p.client||[]; const android=clients.some(c=>c.client_info?.android_client_info?.package_name===expected && String(c.client_info?.mobilesdk_app_id||"").startsWith("1:")); const web=clients.some(c=>(c.oauth_client||[]).some(o=>String(o.client_type)==="3")); if(project!==process.env.FIREBASE_PROJECT_ID || !android || !web){console.error("Firebase JSON must match FIREBASE_PROJECT_ID, Android package com.anchor.parent, and include a Web OAuth client.");process.exit(1)}'
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          chmod 600 "$RUNNER_TEMP/upload.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=$ANDROID_UPLOAD_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$ANDROID_UPLOAD_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Show signing certificate fingerprints
        env:
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          keytool -list -v -keystore "$RUNNER_TEMP/upload.jks" -alias upload -storepass "$ANDROID_UPLOAD_KEYSTORE_PASSWORD" -keypass "$ANDROID_UPLOAD_KEY_PASSWORD" | grep -E 'SHA1:|SHA256:'

      - name: Build signed release APK and Android App Bundle
        run: gradle --no-daemon :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Upload signed release files
        uses: actions/upload-artifact@v4
        with:
          name: anchor-parent-signed-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
