name: Deploy Anchor Firestore rules

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: "Type DEPLOY_RULES to publish the checked-in Firestore rules."
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Firestore security rules only
    if: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/fix/shared-firebase-secure-pairing') && github.event.inputs.confirm_production == 'DEPLOY_RULES' }}
    runs-on: ubuntu-latest
    env:
      FIREBASE_PROJECT_ID: gen-lang-client-0963224775
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Firebase service account
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Missing repository secret FIREBASE_SERVICE_ACCOUNT."
            exit 1
          fi
          node -e 'const x=JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT_JSON); const expected=process.env.FIREBASE_PROJECT_ID; if (!x.project_id || x.project_id !== expected || !x.private_key || !x.client_email) { console.error("Service-account project_id must match FIREBASE_PROJECT_ID."); process.exit(1); }'
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          chmod 600 "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Deploy Firestore rules only
        run: firebase deploy --only firestore:rules --project "$FIREBASE_PROJECT_ID" --non-interactive
