name: Anchor Parent CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Android unit tests and debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add CI-only Google OAuth resource placeholder
        run: |
          mkdir -p app/src/debug/res/values
          cat > app/src/debug/res/values/google_services_ci.xml <<'EOF'
          <resources>
            <string name="default_web_client_id" translatable="false">ci-placeholder.apps.googleusercontent.com</string>
          </resources>
          EOF
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Run unit tests and assemble debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace

  cloud-functions:
    name: Cloud Functions syntax and dependency check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Cloud Functions dependencies
        run: npm install --prefix functions --no-audit --no-fund
      - name: Validate Cloud Functions JavaScript syntax
        run: node --check functions/index.js

  firestore-rules:
    name: Firestore security rules tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Firebase emulator and rules test library
        run: npm install --global firebase-tools @firebase/rules-unit-testing
      - name: Run Firestore emulator security tests
        run: firebase emulators:exec --only firestore --project gen-lang-client-0963224775 'NODE_PATH="$(npm root -g)" node --test firestore.test.js'
